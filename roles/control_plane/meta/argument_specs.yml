---
argument_specs:
  main:
    short_description: Initialize a single Kubernetes control plane
    options:
      kubernetes_control_plane_enabled: {type: bool, required: true}
      kube_config_dir: {type: path, required: true}
      kubernetes_admin_user: {type: str, required: true}
      kubernetes_cri_socket: {type: str, required: true}
      kubernetes_image_repository: {type: str, required: true}
      pod_network_cidr: {type: str, required: true}
      service_network_cidr: {type: str, required: true}
      control_plane_endpoint: {type: str, required: true}
