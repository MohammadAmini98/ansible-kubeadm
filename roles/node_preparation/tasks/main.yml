---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family in kubernetes_supported_os_families
    fail_msg: "This project currently supports Debian and Ubuntu hosts."

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Load Kubernetes kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Check required kernel modules
  ansible.builtin.stat:
    path: "/sys/module/{{ item }}"
  loop:
    "{{ kubernetes_kernel_modules }}"
  register: kubernetes_kernel_modules

- name: Load missing kernel modules
  ansible.builtin.command:
    cmd: "modprobe {{ item.item }}"
  when: not item.stat.exists
  loop: "{{ kubernetes_kernel_modules.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Configure Kubernetes networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    mode: "0644"
    content: |
      {% for name, value in kubernetes_sysctls.items() %}
      {{ name }} = {{ value }}
      {% endfor %}
  notify: Reload Kubernetes sysctls
