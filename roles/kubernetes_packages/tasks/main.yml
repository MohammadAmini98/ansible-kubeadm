---
- name: Install Kubernetes from cached artifacts
  when: use_cached_artifacts | bool
  block:
    - name: Find cached Kubernetes packages on the controller
      ansible.builtin.set_fact:
        kubernetes_cached_packages: >-
          {{ lookup('ansible.builtin.fileglob', role_path + '/files/packages/*.deb', wantlist=True) }}

    - name: Verify cached Kubernetes packages exist
      ansible.builtin.assert:
        that:
          - kubernetes_cached_packages | length > 0
        fail_msg: >-
          No cached Kubernetes packages were found. Run ./download-artifacts.sh
          on the Ansible controller first.

    - name: Create remote package cache
      ansible.builtin.file:
        path: "{{ artifact_remote_dir }}/packages"
        state: directory
        mode: "0755"

    - name: Find existing remote Kubernetes packages
      ansible.builtin.find:
        paths: "{{ artifact_remote_dir }}/packages"
        patterns: "*.deb"
        file_type: file
      register: remote_kubernetes_packages

    - name: Remove stale remote Kubernetes packages
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ remote_kubernetes_packages.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: >-
        item.path | basename not in
        (kubernetes_cached_packages | map('basename') | list)

    - name: Copy cached Kubernetes packages
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ artifact_remote_dir }}/packages/{{ item | basename }}"
        mode: "0644"
      loop: "{{ kubernetes_cached_packages }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Check cached Kubernetes package versions
      ansible.builtin.shell:
        cmd: |
          for package in {{ kubernetes_package_names | join(' ') }}; do
            archive=$(find {{ artifact_remote_dir }}/packages -maxdepth 1 -name "${package}_*.deb" -print -quit)
            test -n "$archive" || exit 1
            installed=$(dpkg-query --show --showformat='${Version}' "$package" 2>/dev/null) || exit 1
            expected=$(dpkg-deb --field "$archive" Version) || exit 1
            test "$installed" = "$expected" || exit 1
          done
      register: kubernetes_cached_versions
      changed_when: false
      failed_when: false

    - name: Install cached Kubernetes packages
      ansible.builtin.shell:
        cmd: >-
          dpkg --unpack {{ artifact_remote_dir }}/packages/*.deb &&
          dpkg --configure --pending
      when: kubernetes_cached_versions.rc != 0
      environment:
        DEBIAN_FRONTEND: noninteractive

- name: Install Kubernetes from its apt repository
  when: not use_cached_artifacts | bool
  block:
    - name: Install Kubernetes repository dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - gpg
        state: present
        update_cache: true

    - name: Create Kubernetes apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-release.key
        mode: "0644"
      register: kubernetes_release_key

    - name: Check whether Kubernetes apt keyring exists
      ansible.builtin.stat:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      register: kubernetes_apt_keyring

    - name: Install Kubernetes repository signing key
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor --yes
          --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          /etc/apt/keyrings/kubernetes-release.key
      when: kubernetes_release_key.changed or not kubernetes_apt_keyring.stat.exists
      changed_when: true

    - name: Configure Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name: "{{ kubernetes_packages }}"
        state: present
        update_cache: true
      vars:
        kubernetes_packages: >-
          {{ kubernetes_package_names |
             map('regex_replace', '$',
                 ('=' + kubernetes_package_version)
                 if kubernetes_package_version else '') | list }}

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    "{{ kubernetes_package_names }}"

- name: Enable kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
