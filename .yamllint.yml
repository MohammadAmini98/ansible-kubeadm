---
extends: default
ignore: |
  .ansible/
  ansible-redis-sentinel-ha/
  roles/calico/files/
  roles/container_runtime/files/
  roles/kubernetes_packages/files/
rules:
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  line-length:
    max: 160
  octal-values:
    forbid-explicit-octal: true
    forbid-implicit-octal: true
  truthy:
    allowed-values: ["true", "false"]
